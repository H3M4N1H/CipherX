[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cipherx"
version = "1.0.0"
description = "Multi-layer CTF cipher/encoding auto-cracker for the terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "H3M4N1H" }]
keywords = ["ctf", "cipher", "cryptography", "decoder", "security", "steganography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
dependencies = ["colorama>=0.4.6"]

[project.optional-dependencies]
crypto = ["pycryptodome>=3.20"]
steg = ["Pillow>=10.3"]
online = ["requests>=2.31"]
full = ["pycryptodome>=3.20", "Pillow>=10.3", "requests>=2.31"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/H3M4N1H/CipherX"
Repository = "https://github.com/H3M4N1H/CipherX"
Issues = "https://github.com/H3M4N1H/CipherX/issues"

[project.scripts]
cipherx = "cipherx.cli:main"

[tool.setuptools.packages.find]
include = ["cipherx*"]

[tool.setuptools.package-data]
cipherx = ["wordlists/*.txt", "wordlists/*.txt.gz"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["cipherx"]
omit = ["cipherx/core/interactive.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
